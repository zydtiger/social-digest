minimum_prek_version: "0.4.14"
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: require-pattern
        name: commit message prefix
        stages: [commit-msg]
        args: ['--multiline', '\A(feat|fix|docs|refactor|test|build|chore|revert)(\([a-z0-9-]+\))?: [a-z]([^\n]*[^.\n])?\n']
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: ruff
        name: ruff check
        entry: uv run ruff check
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pytest
        name: offline tests
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
      - id: docs-layout
        name: Markdown lives in a declared slot
        language: fail
        entry: 'Move to a slot listed in docs/README.md:'
        files: ^[^/]+\.md$|^docs/
        exclude: ^(README|AGENTS)\.md$|^docs/(README|GOAL|STATUS|ROADMAP|ARCHITECTURE)\.md$
      - id: docs-size
        name: State documents stay short
        language: system
        entry: >-
          awk 'FNR==101{print FILENAME " exceeds 100 lines"; bad=1} END{exit bad}'
        files: ^docs/(STATUS|ROADMAP)\.md$
      - id: agents-size
        name: Agent instructions stay short
        language: system
        entry: >-
          awk 'FNR==151{print FILENAME " exceeds 150 lines"; bad=1} END{exit bad}'
        files: ^AGENTS\.md$
